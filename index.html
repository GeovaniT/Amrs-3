<style>

:root {
  --color-fondo: #FFF9E6;     /* crema cálido */
  --color-primario: #F4A261;  /* naranja suave */
  --color-secundario: #E9C46A;/* dorado claro */
  --color-texto: #3E2C23;     /* marrón oscuro */
  --color-romantico: #FFB5A7; /* rosa pastel */
}

body {
  font-family: 'Poppins', sans-serif;
  text-align: center;
  margin: 0;
  color: var(--color-texto);
  background: linear-gradient(to bottom, #FFF9E6, #FFE8A3);
  overflow: hidden;
}

/* Títulos */
h1, h2 {
  color: var(--color-primario);
  margin-top: 30px;
  text-shadow: 0 0 4px rgba(255,255,255,0.6);
}

/* Mensajes */
.mensaje {
  margin: 20px auto;
  font-size: 1.2em;
  background: rgba(255,255,255,0.7);
  padding: 10px 15px;
  border-radius: 10px;
  width: 80%;
  line-height: 1.5;
}

/* Corazón animado */
.corazon {
  font-size: 50px;
  color: var(--color-romantico);
  animation: latido 1s infinite;
}
@keyframes latido {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Botones */
button {
  background: var(--color-secundario);
  color: var(--color-texto);
  font-weight: bold;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: background 0.3s ease;
}
button:hover {
  background: var(--color-primario);
  color: #fff;
}

/* Carrusel optimizado para móvil */
.carrusel {
  position: relative;
  width: 85%;
  margin: auto;
  max-height: 60vh; /* evita que ocupe toda la pantalla */
  overflow: hidden;
}

/* Imágenes adaptables */
.carrusel img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,0.2);
  display: none;
}
.carrusel img.active {
  display: block;
}

/* Botón visible y centrado */
button {
  position: relative;
  z-index: 10; /* asegura que quede encima del carrusel */
  background: var(--color-secundario);
  color: var(--color-texto);
  font-weight: bold;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin: 20px auto;
  display: block;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: background 0.3s ease;
}
button:hover {
  background: var(--color-primario);
  color: #fff;
}

/* Ajuste responsive */
@media (max-width: 600px) {
  .carrusel {
    max-height: 50vh; /* más compacto en móvil */
  }
  button {
    width: 90%;
    font-size: 1em;
  }
}


/* Frases */
.frase {
  margin-top: 10px;
  font-size: 1.2em;
  color: var(--color-primario);
  background: rgba(255,255,255,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  display: inline-block;
}

/* Elementos flotantes */
.corazon-flotante {
  position: absolute;
  font-size: 30px;
  color: var(--color-romantico);
  animation: flotar 6s linear infinite;
}
.flor-amarilla {
  position: absolute;
  font-size: 30px;
  color: var(--color-secundario);
  animation: flotar 8s linear infinite;
}
@keyframes flotar {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Overlay borroso */
#overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.3);
  z-index: 999;
}

/* Mensaje final */
#mensajeFinal {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(1);
  font-size: 3em;
  color: var(--color-romantico);
  text-shadow: 0 0 15px #fff, 0 0 30px var(--color-romantico);
  opacity: 0;
  text-align: center;
  white-space: nowrap; /* evita que se corte el texto */
  animation: aparecerZoom 3s forwards, pulsoZoom 4s infinite ease-in-out, brilloSuave 3s infinite alternate;
  z-index: 1000;
}

/* Aparición inicial */
@keyframes aparecerZoom {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* Pulso suave (acercarse y alejarse) */
@keyframes pulsoZoom {
  0% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.1); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* Brillo intermitente */
@keyframes brilloSuave {
  0% { text-shadow: 0 0 10px #fff, 0 0 20px var(--color-romantico); }
  100% { text-shadow: 0 0 25px #fff, 0 0 40px var(--color-romantico); }
}

/* Ajuste responsive para móviles */
@media (max-width: 600px) {
  #mensajeFinal {
    font-size: 2em; /* reduce tamaño para pantallas pequeñas */
    white-space: normal; /* permite que el texto se acomode en varias líneas */
    line-height: 1.3;
    padding: 0 10px;
  }
}

</style>
<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para ti ❤️</title>

</head>
<body>
  <h1>21 Septiembre</h1>
  <div class="mensaje">Aunque no pueda estar contigo hoy, siempre estás en mi corazón.</div>
  <div class="corazon">❤️</div>

  <h2>Nuestros recuerdos 📸</h2>
  <div class="carrusel">
    <img src="foto1.jpg" class="active" alt="Recuerdo 1">
    <img src="foto2.jpg" alt="Recuerdo 2">
    <img src="foto3.jpg" alt="Recuerdo 3">
    <img src="foto4.jpg" alt="Recuerdo 4">
  </div>
  <div class="frase" id="frase">Contigo todo es mejor 💖</div>

  <audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>


  <h2>Un detalle para ti ✨</h2>
  <button onclick="lluviaSorpresa()">💖Presionar💖</button>
  <div class="sorpresa" id="sorpresa">Siempre contigo, aunque lejos 💖</div>

  <div id="overlay"></div>
<div id="mensajeFinal">💖🌼TE AMO 🌼💖</div>
<script src="js/script.js"></script>
</body>
</html>
